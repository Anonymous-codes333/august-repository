<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User form</title>
    <link rel="stylesheet" href="../static/css/input.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex min-h-screen w-full justify-center items-center p-4">

    <div class="p-15 grid h-screen w-full justify-center items-center">
        <form action="{% url 'submit_form' %}" method="POST" class="grid items-start p-2 shadow-2xl w-80 max-w-125">
            {% csrf_token %}
            <input class="w-full p-2" name="name" type="text" placeholder="Enter your Name: " /><br />
            <input class="w-full p-2" name="department" type="text" placeholder="Enter your Department: " /><br />
            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-3 rounded-lg transition duration-200 mt-2" type="submit">Submit</button>
        </form>
    </div>
    
</body>
</html>
